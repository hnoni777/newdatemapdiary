<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HereWithYou - SkyView Elite Edition</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5A79;
            --primary-dark: #E03E5E;
            --secondary: #4A3036;
            --bg-soft: #FFF5F7;
            --white: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 10px 30px rgba(255, 90, 121, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-soft);
            color: var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container { width: 100%; max-width: 420px; text-align: center; }

        .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3em; color: var(--primary); margin-bottom: 2rem; }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 1rem;
        }

        .hero-title { font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin-bottom: 1rem; }

        .highlight { color: var(--primary); display: block; }

        .hero-description { font-size: 1rem; line-height: 1.5; color: #666; margin-bottom: 2.5rem; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.4rem;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: none;
            cursor: pointer;
        }

        .btn-main {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 8px 20px rgba(255, 90, 121, 0.3);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .btn-main:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(255, 90, 121, 0.4); }

        .location-box { background: rgba(255, 90, 121, 0.05); padding: 1.2rem; border-radius: 24px; margin-bottom: 2rem; border: 1px dashed var(--primary); }

        .footer { margin-top: 2rem; font-size: 0.8rem; color: rgba(74, 48, 54, 0.4); }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">HERE WITH YOU</div>
        <div class="card">
            <h1 class="hero-title">HereWithYou <br><span class="highlight">v1.14.0 SkyView</span></h1>
            <p class="hero-description">
                가장 웅장한 추억지도의 시작, <br>
                <strong>SkyView 기본 탑재</strong> 및 슬림 뷰 시스템!
            </p>

            <div class="location-box">
                <div id="address" style="font-size: 0.9rem; color: var(--primary-dark); font-weight: 600;">우리만의 특별한 추억 장소 확인 📍</div>
            </div>

            <a href="https://github.com/hnoni777/newdatemapdiary/releases/download/v1.14.0/NewDateMapDiary_v1_14_0_SkyView.apk" class="btn btn-main">
                🚀 무료 다운로드 (v1.14.0)
            </a>

            <button onclick="openApp()" class="btn" style="background: var(--secondary); color: white; margin-top: 0.5rem; font-size: 0.95rem;">
                지도로 바로 가기 🗺️
            </button>
        </div>
        <div class="footer">&copy; 2026 HereWithYou. Build for Love.</div>
    </div>

    <script>
        function openApp() {
            window.location.href = "hnoni777://newdatemapdiary";
            setTimeout(function() {
                alert("앱이 설치되어 있지 않다면 다운로드 버튼을 눌러주세요!");
            }, 2000);
        }
    </script>
</body>
</html>
